services:
  - type: web
    name: cloud-guestbook
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cloud-guestbook-db
          property: connectionString

databases:
  - name: cloud-guestbook-db
    databaseName: guestbook
    user: guestbook_user
    plan: free
    region: singapore
